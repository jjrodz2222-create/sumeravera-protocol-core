name: SumerAvera Protocol Verification CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  protocol-verification:
    name: Protocol Verification
    runs-on: ubuntu-latest

    steps:
      - name: Step 1 - Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Node.js runtime
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Step 3 - Install clean dependencies
        run: npm ci || npm install

      - name: Step 4 - Run static linting and syntax validation
        run: npm run lint --if-present

      - name: Step 5 - Execute unit and state-ledger invariant test suites
        run: npm test --if-present

      - name: Step 6 - Run gateway health check and integration smoke tests
        run: |
          # Start SumerAvera gateway in background for smoke testing
          npm start &
          SERVER_PID=$!
          
          # Poll health endpoint with timeout
          echo "Waiting for SumerAvera Gateway health endpoint (/api/v1/health)..."
          for i in {1..30}; do
            if curl -s -f http://localhost:3000/api/v1/health > /dev/null 2>&1; then
              echo "Gateway health probe responded successfully (HTTP 200 OK)."
              curl -s http://localhost:3000/api/v1/health | jq . || curl -s http://localhost:3000/api/v1/health
              break
            fi
            sleep 1
          done

          # Verify active response
          HEALTH_STATUS=$(curl -s http://localhost:3000/api/v1/health | grep -o '"status":"HEALTHY"' || true)
          if [ -z "$HEALTH_STATUS" ]; then
            echo "Smoke test health check verification failed."
            kill $SERVER_PID 2>/dev/null || true
            exit 1
          fi

          echo "Ingress and health check smoke tests verified."
          kill $SERVER_PID 2>/dev/null || true

      - name: Step 7 - Build verification artifacts
        run: npm run build --if-present
