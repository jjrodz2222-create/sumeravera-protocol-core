name: SumerAvera Protocol Verification CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  protocol-verification:
    name: Protocol Verification
    runs-on: ubuntu-latest

    steps:
      - name: Step 1 - Checkout repository code
        uses: actions/checkout@v4

      - name: Step 2 - Set up Python environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Step 3 - Set up Node.js runtime
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Step 4 - Install clean dependencies
        run: npm ci || npm install

      - name: Step 5 - Run static linting and syntax validation
        run: npm run lint --if-present

      - name: Step 6 - Execute unit and state-ledger invariant test suites
        run: npm test --if-present

      - name: Step 7 - Build verification artifacts and server bundle
        run: |
          npm run build
          ls -la dist/
          if [ ! -f "dist/server.cjs" ]; then
            echo "ERROR: dist/server.cjs was not generated by npm run build"
            exit 1
          fi

      - name: Step 8 - Run gateway health check and integration smoke tests
        run: |
          # Start SumerAvera gateway in background from compiled production bundle
          node dist/server.cjs > server.log 2>&1 &
          SERVER_PID=$!
          
          # Poll health endpoint with timeout
          echo "Waiting for SumerAvera Gateway health endpoint (/api/v1/health)..."
          SUCCESS=0
          for i in {1..30}; do
            if curl -s -f http://localhost:3000/api/v1/health > /dev/null 2>&1; then
              echo "Gateway health probe responded successfully (HTTP 200 OK)."
              curl -s http://localhost:3000/api/v1/health || true
              echo ""
              SUCCESS=1
              break
            fi
            sleep 1
          done

          if [ $SUCCESS -ne 1 ]; then
            echo "Smoke test health check verification failed to respond within 30s. Server logs:"
            cat server.log || true
            kill $SERVER_PID 2>/dev/null || true
            exit 1
          fi

          # Verify active response
          HEALTH_STATUS=$(curl -s http://localhost:3000/api/v1/health | grep -o '"status":"HEALTHY"' || true)
          if [ -z "$HEALTH_STATUS" ]; then
            echo "Smoke test health check status is not HEALTHY. Response:"
            curl -s http://localhost:3000/api/v1/health || true
            echo "Server logs:"
            cat server.log || true
            kill $SERVER_PID 2>/dev/null || true
            exit 1
          fi

          echo "Ingress and health check smoke tests verified."
          kill $SERVER_PID 2>/dev/null || true

